name: Deploy React Frontend to Vercel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Vercel Secrets
        run: |
          MISSING=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret 'VERCEL_TOKEN' is missing or empty. Please add it under Repository Settings > Secrets and variables > Actions."
            MISSING=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::GitHub secret 'VERCEL_ORG_ID' is missing or empty. Please add it under Repository Settings > Secrets and variables > Actions."
            MISSING=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::GitHub secret 'VERCEL_PROJECT_ID' is missing or empty. Please add it under Repository Settings > Secrets and variables > Actions."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts
        run: vercel build --prod

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod
